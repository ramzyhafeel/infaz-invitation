<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- PRIMARY SEO & INVITATION TITLE -->
    <title>Mohamed Infaz & Fathima Hafsa | Wedding Invitation</title>
    <meta
      name="description"
      content="You're invited to celebrate the wedding of Mohamed Infaz & Fathima Hafsa on 25 April 2027 at Ilma Reception Hall."
    />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon/favicon.png" />

    <!-- GOOGLE FONTS PRECONNECT & LOAD -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- PRELOAD HERO COVER IMAGE -->
    <link rel="preload" as="image" href="/images/cover/cover.jpg" />

    <!-- ===================================================================
         OPEN GRAPH / WHATSAPP / FACEBOOK PREVIEW METADATA
         
         NOTE FOR DEPLOYMENT:
         WhatsApp and social media crawlers require an absolute HTTPS URL for og:image.
         Replace 'https://infaz-hafsa.netlify.app' below with your final deployed Netlify domain.
         =================================================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mohamed Infaz & Fathima Hafsa Wedding" />
    <meta property="og:title" content="Mohamed Infaz & Fathima Hafsa" />
    <meta
      property="og:description"
      content="Together with our families, we invite you to celebrate our wedding on 25 April 2027 at Ilma Reception Hall."
    />
    <!-- REPLACE WITH YOUR LIVE NETLIFY DOMAIN ONCE DEPLOYED: -->
    <meta property="og:url" content="https://infaz-hafsa.netlify.app/" />
    <meta property="og:image" content="https://infaz-hafsa.netlify.app/images/preview/wedding-preview.jpg" />
    <meta property="og:image:secure_url" content="https://infaz-hafsa.netlify.app/images/preview/wedding-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wedding Invitation - Mohamed Infaz & Fathima Hafsa" />

    <!-- TWITTER CARD METADATA -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohamed Infaz & Fathima Hafsa | Wedding Invitation" />
    <meta
      name="twitter:description"
      content="Together with our families, we invite you to celebrate our wedding on 25 April 2027 at Ilma Reception Hall."
    />
    <meta name="twitter:image" content="https://infaz-hafsa.netlify.app/images/preview/wedding-preview.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
